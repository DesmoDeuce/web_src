baseURL: /
locale: en-us
build:
  writeStats: true
title: Desmond Ducy

security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'

params:
  author: Desmond Ducy
  description: Desmond Ducy portfolio.
  copyright: powered by [hugo](https://gohugo.io/)
  theme:
    mainTheme: dark
    showAttribute: true
    singlePage: false
  accordion:
    - item: about_me
      expand: true # only the first `expand: true` will take effect
    - item: projects
    - item: experiences
    - item: education
    - item: skills
      panel_id: skill-panel
    - item: hobbies
